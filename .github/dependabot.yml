version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Keep routine patch/minor noise down to one PR per week.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Only even-numbered Node majors become LTS; odd ones are EOL within
      # about six months. Dependabot proposed node:25-alpine, which was
      # already EOL (2026-06-01). It cannot express "even majors only", so
      # patch and minor bumps flow automatically and major bumps are done
      # by hand when the next LTS line opens.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
