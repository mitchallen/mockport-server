version: 2
# Noise control: `cooldown` skips releases younger than 7 days, so a burst of
# quick patch releases lands as one bump to the latest instead of a PR each.
# Cooldown does not delay security updates.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Keep routine patch/minor noise down to one PR per month. Security
      # updates ignore the schedule and still open as soon as an alert fires.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Only even-numbered Node majors become LTS; odd ones are EOL within
      # about six months. Dependabot proposed node:25-alpine, which was
      # already EOL (2026-06-01). It cannot express "even majors only", so
      # patch and minor bumps flow automatically and major bumps are done
      # by hand when the next LTS line opens.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
