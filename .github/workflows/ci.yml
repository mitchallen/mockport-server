name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30; engines requires >=22.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Node's built-in test coverage (no c8) fails the step below 100% line,
      # branch or function coverage of src/ (the thresholds in package.json's
      # test:coverage), so this is the test gate and the coverage gate.
      - run: npm run test:coverage

      # test:coverage also writes the spec output to coverage/report.txt; copy
      # just its coverage table into the job summary.
      - name: Coverage summary
        if: always() && matrix.node-version == '24.x' && hashFiles('coverage/report.txt') != ''
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage/report.txt \
              | sed -E 's/^ℹ //; /(start|end) of coverage report/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && matrix.node-version == '24.x' && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Fail on known vulnerabilities
        run: npm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    # Build under a throwaway name so a CI image is never mistaken for a
    # publishable one. Both are picked up by the Makefile's ?= defaults.
    env:
      IMAGE: mockport-server
      TAG: ci
    steps:
      - uses: actions/checkout@v7

      # `make smoke` builds the image, waits for the server, curls a mock and
      # removes the container whether or not the check passed. Driving it from
      # the Makefile rather than inline here keeps this identical to what
      # `make ci` runs locally, so the two cannot drift apart.
      - name: Verify the image serves its built-in mockfile
        run: make smoke MOUNT=

      # MOUNT is what a user supplies with -v, and test/data mocks /dogs/*
      # instead of /pets/*, so this proves the override actually takes effect
      # rather than the built-in file answering both times.
      - name: Verify a mounted mockfile overrides the built-in one
        run: make smoke
